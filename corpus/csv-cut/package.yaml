# csv-cut — a delimited row that re-scans from the front on every field access.
#
# The row is fixed once parsed, yet reaching field i walks past i delimiters from
# the start each time. A single pass at parse time that records where each field
# begins turns every access into one array read. A redundant rescan, not a data
# structure the agent has to invent.

package_id: csv-cut
family: parsing
license: MIT
revision: "0000000000000000000000000000000000000000"

hidden_family: false

build_command: >-
  cmake -S . -B build -DCMAKE_BUILD_TYPE=Release &&
  cmake --build build -j8

forbidden_flags:
  - "-ffast-math"
  - "-fno-strict-aliasing"
  - "-fwrapv"

test_command: ./build/test_csvcut
test_inventory_globs:
  - "tests/**/*"

benchmark_command: ./build/bench

differential_command: ./build/differential
objective: balanced
measured_region: cf_bench_start/cf_bench_stop

# Field count is the axis that decides how far the front-rescan walks, so it is
# what the profiles vary. Field width and query count are held constant.
workload_profiles:
  - name: narrow
    args: ["--fields", "6", "--width", "3", "--queries", "900"]
    published: true
    selection_weight: 3.0
    s_ref_deterministic: 5.329538
  - name: medium
    args: ["--fields", "12", "--width", "3", "--queries", "900"]
    published: true
    selection_weight: 2.0
    s_ref_deterministic: 9.666793
  - name: wide
    args: ["--fields", "24", "--width", "3", "--queries", "900"]
    published: false
    selection_weight: 1.0
    s_ref_deterministic: 17.462856

equivalence_discipline: byte_equal
side_effects:
  - stdout
  - exit_code

reference:
  patch_path: reference.patch
  origin: curated

resources:
  cpu_cores: 8
  ram_gb: 16
  disk_gb: 32
  pids_max: 512
  model_token_budget: 150000

fuzz_targets: []

input_generator: python3 tools/generate_cases.py
