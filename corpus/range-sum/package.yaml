# range-sum — a range-query table that answers in linear time what a running
# total answers in constant time.
#
# Every value is fixed at build time. Both queries re-walk the requested range on
# every call, though a single prefix pass carried once across the sequence would
# let either be answered by one subtraction. The agent has to notice that the
# data does not change, not spot a pattern in text.

package_id: range-sum
family: data_structures
license: MIT
revision: "0000000000000000000000000000000000000000"

hidden_family: false

build_command: >-
  cmake -S . -B build -DCMAKE_BUILD_TYPE=Release &&
  cmake --build build -j8

forbidden_flags:
  - "-ffast-math"
  - "-fno-strict-aliasing"
  - "-fwrapv"

test_command: ./build/test_rangesum
test_inventory_globs:
  - "tests/**/*"

benchmark_command: ./build/bench

differential_command: ./build/differential
objective: balanced
measured_region: cf_bench_start/cf_bench_stop

# Sequence length is the axis that decides how far each query walks, so it is
# what the profiles vary. Query count is held constant so they differ in one
# variable only.
workload_profiles:
  - name: short
    args: ["--values", "12", "--queries", "900"]
    published: true
    selection_weight: 3.0
    s_ref_deterministic: 2.631842
  - name: medium
    args: ["--values", "24", "--queries", "900"]
    published: true
    selection_weight: 2.0
    s_ref_deterministic: 3.745809
  - name: long
    args: ["--values", "48", "--queries", "900"]
    published: false
    selection_weight: 1.0
    s_ref_deterministic: 5.744276

equivalence_discipline: byte_equal
side_effects:
  - stdout
  - exit_code

reference:
  patch_path: reference.patch
  origin: curated

resources:
  cpu_cores: 8
  ram_gb: 16
  disk_gb: 32
  pids_max: 512
  model_token_budget: 150000

fuzz_targets: []

input_generator: python3 tools/generate_cases.py
