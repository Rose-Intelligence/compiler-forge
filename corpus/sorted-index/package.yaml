# sorted-index — a sorted string index queried the wrong way.
#
# The inefficiency here is algorithmic rather than incidental. Nothing is
# recomputed and nothing is allocated badly; the code simply ignores an
# invariant it already guarantees. si_build requires sorted input and both
# queries walk the whole array anyway, so every lookup costs O(n) where the
# information for O(log n) was already present.
#
# That makes it a different shape of problem from string-split (a redundant
# scan) and matrix-stats (cost spread across translation units): an agent has to
# notice a property of the data, not a pattern in the text.

package_id: sorted-index
family: data_structures
license: MIT
revision: "0000000000000000000000000000000000000000"

hidden_family: false

build_command: >-
  cmake -S . -B build -DCMAKE_BUILD_TYPE=Release &&
  cmake --build build -j8

forbidden_flags:
  - "-ffast-math"
  - "-fno-strict-aliasing"
  - "-fwrapv"

test_command: ./build/test_sortedindex
test_inventory_globs:
  - "tests/**/*"

benchmark_command: ./build/bench

# Reads one case on stdin and prints every declared observable. Kept separate
# from the benchmark, which is argument-driven and prints a summary.
differential_command: ./build/differential
objective: balanced
measured_region: cf_bench_start/cf_bench_stop

# Index size is the axis that decides how badly a linear scan hurts, so it is
# what the profiles vary. Query count is held constant so the profiles differ in
# one variable only.
workload_profiles:
  - name: small-index
    args: ["--keys", "40", "--queries", "900"]
    published: true
    selection_weight: 3.0
    s_ref_deterministic: 4.773098
  - name: medium-index
    args: ["--keys", "110", "--queries", "900"]
    published: true
    selection_weight: 2.0
    s_ref_deterministic: 11.365752
  - name: large-index
    args: ["--keys", "300", "--queries", "900"]
    published: false
    selection_weight: 1.0
    s_ref_deterministic: 25.338183

# The differential harness prints its observables in a fixed order, so the
# comparison is exact. Nothing here is order-independent.
equivalence_discipline: byte_equal
side_effects:
  - stdout
  - exit_code

reference:
  patch_path: reference.patch
  origin: curated

resources:
  cpu_cores: 8
  ram_gb: 16
  disk_gb: 32
  pids_max: 512
  model_token_budget: 150000

fuzz_targets: []

input_generator: python3 tools/generate_cases.py
